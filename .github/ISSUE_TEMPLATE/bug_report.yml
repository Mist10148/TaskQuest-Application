name: Bug report
description: Something in the bot, the web app, the API or the AI service does not work as documented.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, do not open an issue: see [SECURITY.md](https://github.com/Mist10148/TaskQuest-Application/blob/main/SECURITY.md#5-reporting-a-vulnerability).
        Check [docs/KNOWN_ISSUES.md](https://github.com/Mist10148/TaskQuest-Application/blob/main/docs/KNOWN_ISSUES.md) first; the limitation may already be listed.
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Discord bot (apps/bot)
        - Web app (apps/web)
        - Web API (apps/server)
        - Shared rules or database (packages/shared)
        - AI service (apps/ai)
        - Deployment or configuration
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, including any error message or toast. Never paste tokens, secrets or other people's Discord IDs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Link the doc that describes the expected behaviour if there is one (for example docs/GAMEPLAY.md or docs/API.md).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /list ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: A release from CHANGELOG.md or a commit hash.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and OS, Discord client, Node and Python versions, local or hosted (Render, other), AI on or off.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server, bot or AI service log lines, with secrets removed.
      render: text
