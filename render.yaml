# Render Blueprint for TaskQuest (https://render.com/docs/blueprint-spec)
#
# Services share one MySQL database (bring your own: Aiven, PlanetScale,
# Railway, TiDB, ...). Database migrations run automatically on startup.
#
#   taskquest-web  Express API + built React app on ONE origin (first-party cookies)
#   taskquest-bot  Discord bot (long-lived gateway connection)
#
# After the first deploy:
#   1. Set PUBLIC_URL to the web service URL (e.g. https://taskquest-web.onrender.com)
#   2. Add <PUBLIC_URL>/api/auth/callback as an OAuth2 redirect in the Discord developer portal
#   3. Register slash commands once: npm run deploy:commands (with DISCORD_TOKEN + CLIENT_ID set)
# See docs/DEPLOYMENT.md for details.

envVarGroups:
  - name: taskquest-database
    envVars:
      - key: DB_URL            # mysql://user:password@host:port/database
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: DB_SSL_CA         # optional: provider CA certificate (PEM contents)
        sync: false

  # Optional AI features (docs/AI_INTEGRATION.md). Shared by web, bot and ai so
  # all three get the same service-to-service token. Keep AI_ENABLED=false on web
  # and bot until the taskquest-ai service is deployed and GEMINI_API_KEY is set.
  - name: taskquest-ai
    envVars:
      - key: AI_INTERNAL_TOKEN
        generateValue: true

services:
  - type: web
    name: taskquest-web
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - fromGroup: taskquest-database
      - fromGroup: taskquest-ai
      - key: AI_ENABLED
        value: "false"          # set to "true" once taskquest-ai is running
      - key: AI_SERVICE_URL     # internal host of the private service, e.g. http://taskquest-ai:10000
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: PUBLIC_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false

  # Background workers need a paid plan on Render. The bot also exposes a small
  # health endpoint on $PORT, so it can run as a free "web" service instead,
  # but free web services sleep when idle, which disconnects the bot.
  - type: worker
    name: taskquest-bot
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:bot
    envVars:
      - fromGroup: taskquest-database
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: WEB_APP_URL
        sync: false
      # /summary, /prioritize and /ask call taskquest-ai directly
      - fromGroup: taskquest-ai
      - key: AI_ENABLED
        value: "false"          # set to "true" once taskquest-ai is running
      - key: AI_SERVICE_URL     # internal host of the private service, e.g. http://taskquest-ai:10000
        sync: false

  # Private AI service (Gemini + LangChain + LangGraph). Reachable only from the
  # other Render services, never from the internet. Needs a paid plan.
  - type: pserv
    name: taskquest-ai
    runtime: python
    plan: starter
    rootDir: apps/ai
    # index_docs embeds the help docs once per deploy; it never fails the build
    # (it is skipped if the database or GEMINI_API_KEY is unavailable at build time).
    buildCommand: pip install . && python -m app.rag.index_docs
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - fromGroup: taskquest-database
      - fromGroup: taskquest-ai
      - key: PYTHON_VERSION
        value: "3.12"
      - key: GEMINI_API_KEY
        sync: false
      - key: WEB_INTERNAL_URL   # internal host of taskquest-web, e.g. http://taskquest-web:10000
        sync: false
